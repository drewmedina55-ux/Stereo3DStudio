# Robo build: whenever the version in app/stereo3dstudio/__init__.py changes on main, build the full
# setup package on a Windows runner and publish it as a GitHub release (v<version>).
name: Build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Keep files exactly as committed
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $m = Select-String -Path app/stereo3dstudio/__init__.py -Pattern '^VERSION = "([^"]+)"'
          $v = $m.Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
          gh release view "v$v" 2>$null
          if ($LASTEXITCODE -eq 0) { "exists=true" >> $env:GITHUB_OUTPUT; Write-Host "Release v$v already exists - nothing to do." }
          else { "exists=false" >> $env:GITHUB_OUTPUT; $global:LASTEXITCODE = 0 }
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build setup package
        if: steps.ver.outputs.exists == 'false'
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $name = "Stereo3DStudio_v$v"
          New-Item -ItemType Directory -Force out | Out-Null
          git archive --format=zip --prefix="$name/" -o out/src.zip HEAD
          Expand-Archive out/src.zip -DestinationPath out
          Remove-Item -Recurse -Force "out/$name/docs", "out/$name/.github", "out/$name/release-notes", "out/$name/.gitattributes", "out/$name/.gitignore" -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force "out/$name/models/iw3/pretrained_models/hub/checkpoints" | Out-Null
          $csc = Join-Path $env:WINDIR "Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          $dir = (Resolve-Path "out\$name").Path              # csc needs Windows-style absolute paths
          & $csc /nologo /target:winexe /optimize+ "/win32icon:$dir\assets\stereo3dstudio.ico" /r:System.Windows.Forms.dll "/out:$dir\Stereo3DStudio.exe" "$dir\installer\Launcher.cs"
          if (-not (Test-Path "out/$name/Stereo3DStudio.exe")) { throw "Launcher did not compile" }
          Push-Location out
          7z a -tzip "$name`_Setup.zip" $name | Out-Null
          Pop-Location
          Get-Item "out/$name`_Setup.zip" | Format-List Name, Length
          # standard Windows setup wizard (NSIS) from the same files, without the zip-only .bat installers and
          # without a models folder (so installing over an existing install never touches downloaded models)
          $stage = (New-Item -ItemType Directory -Force "out/wizard").FullName
          Copy-Item -Recurse "out/$name/*" $stage
          Remove-Item -Recurse -Force "$stage/models", "$stage/Install Stereo3D Studio.bat", "$stage/Uninstall Stereo3D Studio.bat", "$stage/installer/Stereo3DStudio.nsi" -ErrorAction SilentlyContinue
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) { choco install nsis -y --no-progress | Out-Null }
          $vi = (($v.Split('.') + @('0', '0', '0'))[0..3]) -join '.'
          & $makensis /V2 "/DVERSION=$v" "/DVIVERSION=$vi" "/DSRC=$stage" "installer\Stereo3DStudio.nsi"
          Move-Item "installer\$name`_Setup.exe" "out\$name`_Setup.exe"
          Get-Item "out/$name`_Setup.exe" | Format-List Name, Length

      - name: Publish release
        if: steps.ver.outputs.exists == 'false'
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $notes = "release-notes/v$v.md"
          if (-not (Test-Path $notes)) { "Stereo3D Studio $v - see CHANGELOG.md." | Set-Content $notes }
          gh release create "v$v" "out/Stereo3DStudio_v$v`_Setup.exe" "out/Stereo3DStudio_v$v`_Setup.zip" --title "Stereo3D Studio $v" --notes-file $notes --target $env:GITHUB_SHA --latest
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Refresh release notes
        if: steps.ver.outputs.exists == 'true'
        shell: pwsh
        run: |
          # an existing release keeps its files; only its text is updated from release-notes/v<version>.md
          $v = "${{ steps.ver.outputs.version }}"
          $notes = "release-notes/v$v.md"
          if (Test-Path $notes) { gh release edit "v$v" --notes-file $notes }
        env:
          GH_TOKEN: ${{ github.token }}
